# Refreshes README.md from InterviewChamp.AI every 3 hours (the list's words live on interviewchamp.ai).
name: Refresh the job list
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/refresh.yml
permissions:
  contents: write
concurrency:
  group: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download the latest list
        run: curl -fsSL --retry 3 --retry-delay 30 "https://interviewchamp.ai/jobs/lists/software-engineer-jobs/readme.md" -o README.md
      - name: Commit it when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update job list"
          git push
